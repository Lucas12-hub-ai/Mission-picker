<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🕵️ 청년센터 단합 개인 비밀미션!</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        /* 기본 설정 */
:root {
    --gold: #c5a059;
    --deep-blue: #0f0c29;
    --mystic-purple: #302b63;
    --cream: #f3f0df;
}

body {
    background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
    display: flex;
    flex-direction: column;
    align-items: center;
    /* justify-content: center; 를 제거하여 상단부터 자연스럽게 배치되도록 함 */
    min-height: 100vh;
    margin: 0;
    padding: 20px 10px; /* 상하좌우 여백 추가 */
    font-family: 'Pretendard', sans-serif;
    color: var(--cream);
    overflow-x: hidden;
}

/* 전체 내용을 감싸는 박스 (PC에서도 폭이 너무 넓어지지 않게 고정) */
.main-container {
    width: 100%;
    max-width: 450px; 
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}

h1 {
    font-size: 1.6rem; /* 모바일에 맞춰 살짝 줄임 */
    color: var(--gold);
    text-shadow: 0 0 10px rgba(197, 160, 89, 0.5);
    margin-bottom: 5px;
}

.subtitle {
    font-size: 0.85rem;
    opacity: 0.8;
    margin-bottom: 25px;
}

/* 카드들이 들어가는 가로 줄 */
.card-row {
    display: flex;
    justify-content: center;
    gap: 12px; /* 카드 사이 간격 */
    width: 100%;
    margin-bottom: 20px;
}

/* 카드와 선택 버튼을 감싸는 개별 래퍼 */
.card-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
}

/* 카드 컨테이너 (3D 환경) */
.card-container {
    perspective: 1000px; /* 수치를 높여 더 부드러운 3D 효과 */
    width: 100%;
    max-width: 160px; /* 모바일 2장 배치를 위해 최대 폭 제한 */
    aspect-ratio: 2 / 3; /* 카드 비율 유지 */
    cursor: pointer;
    position: relative;
}

/* 실제 카드 */
.card {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    border-radius: 15px;
}

/* 카드가 뒤집혔을 때 */
.card.is-flipped {
    transform: rotateY(180deg);
}

/* 카드 앞/뒷면 공통 */
.card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 15px;
    border: 3px solid var(--gold); /* 모바일에서는 테두리를 살짝 얇게 */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px;
    box-sizing: border-box;
}

/* 카드 앞면 (닫힌 상태) */
.card-front {
    background: #1a1a2e;
    background-image: 
        radial-gradient(circle at 50% 50%, rgba(197, 160, 89, 0.1) 0%, transparent 80%),
        url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0l3 27 27 3-27 3-3 27-3-27-27-3 27-3z' fill='%23c5a059' fill-opacity='0.1'/%3E%3C/svg%3E");
}

/* 가상 요소 텍스트 조정 (카드 폭에 맞게 자동 줄바꿈) */
.card-front::after {
    content: "SECRET\nMISSION";
    white-space: pre;
    text-align: center;
    font-size: 1.1rem; /* 카드 크기에 맞춰 조정 */
    font-weight: bold;
    color: var(--gold);
    letter-spacing: 2px;
    border: 1px solid var(--gold);
    padding: 10px;
    width: 70%;
}

/* 카드 뒷면 (미션 공개 상태) */
.card-back {
    background: var(--cream);
    color: #1a1a2e;
    transform: rotateY(180deg);
}

.mission-cat {
    font-size: 0.7rem;
    color: #8b733a;
    font-weight: bold;
    margin-bottom: 10px;
    text-transform: uppercase;
    border-bottom: 1px solid #8b733a;
    padding-bottom: 3px;
}

.mission-text {
    font-size: 0.95rem; /* 모바일에서 글자가 넘치지 않게 조정 */
    font-weight: 800;
    line-height: 1.4;
    word-break: keep-all;
    text-align: center;
}

/* 조작 버튼 영역 */
.controls {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
}

button {
    padding: 12px 20px;
    font-size: 0.95rem;
    font-weight: bold;
    border: 2px solid var(--gold);
    background: transparent;
    color: var(--gold);
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s;
}

button:hover:not(:disabled) {
    background: var(--gold);
    color: white;
    box-shadow: 0 0 15px rgba(197, 160, 89, 0.4);
}

/* 비활성화 상태 (회색 처리) */
button:disabled {
    border-color: #555;
    color: #888;
    background: rgba(255, 255, 255, 0.05);
    cursor: not-allowed;
    opacity: 0.6;
}

/* 개별 선택 버튼 전용 */
.select-btn {
    font-size: 0.8rem;
    padding: 8px 15px;
}
    </style>
</head>
<body>

<div class="container">
    <h1>🕵️‍♂️ 단합 개인 비밀미션 뽑기</h1>
    <p class="subtitle">양양 단합대회 — 질서 안의 자유!</p>

    <p class="guide" id="guide">버튼을 눌러 미션 카드를 뽑으세요!</p>

    <div id="cardArea" class="card-area">
        <div class="cards-single">
            <div class="card-scene solo">
                <div class="card-inner">
                    <div class="card-face card-back"></div>
                </div>
            </div>
        </div>
    </div>

    <button class="btn-main" id="drawBtn" onclick="drawMissions()">🎲 미션 2장 뽑기</button>

    <p class="footer-text">※ 미션은 비밀입니다. 들키면 바다 입수! 🌊</p>
</div>

<script>
// 미션 데이터 (기존 데이터 유지)
const missions = [
    { cat: "유형 1: 하늘에 촥! 붙기!", text: "담당 강사님(주강사님, 총무님)과 함께 손가락 하트 만들고 셀카 찍기" },
    { cat: "유형 1: 하늘에 촥! 붙기!", text: "총무님께 '오늘따라 참 귀여우시네요' 혹은 '귀엽다'는 말 듣기" },
    { cat: "유형 1: 하늘에 촥! 붙기!", text: "담당 강사님(주강사님)과 기분 좋게 '하이파이브' 2번 하기" },
    { cat: "유형 1: 하늘에 촥! 붙기!", text: "총무님께 나란히 서서 팔짱끼고 사진 찍기" },
    { cat: "유형 2: 사명자 친밀도 UP", text: "다른 차량 사명자에게 전화를 걸어 '사랑합니다, 연합합시다!' 외치고 끊기" },
    { cat: "유형 2: 사명자 친밀도 UP", text: "오늘 파란색(또는 특정색) 아이템을 착용한 사명자 찾아 패션 칭찬하기" },
    { cat: "유형 2: 사명자 친밀도 UP", text: "카페나 식당에서 다른 사명자의 빈 컵이나 쓰레기 3개 이상 대신 치워주기" },
    { cat: "유형 2: 사명자 친밀도 UP", text: "누군가의 고민을 듣게 된다면 '제가 오늘 꼭 기도할게요'라고 답해주기" },
    { cat: "유형 2: 사명자 친밀도 UP", text: "5명 이상 모인 곳에서 '우리는 하나!' 선창하고 후창 유도하기" },
    { cat: "유형 2: 사명자 친밀도 UP", text: "오늘 하루 동안 서로 다른 사명자 5명에게 '엄지 척' 날려주기" },
    { cat: "유형 2: 사명자 친밀도 UP", text: "상대방에게 'OO님은 진짜 센터의 기둥이세요'라고 말해주기" },
    { cat: "유형 3: 텐션 UP! 웃음 유발", text: "바다를 향해 '양양아!! 내가 왔다!' 라고 크게 외치기 (최소 3명 동반)" },
    { cat: "유형 3: 텐션 UP! 웃음 유발", text: "사진 찍어주는 척하면서 내 얼굴 셀카 3장 몰래 찍어두기" },
    { cat: "유형 3: 텐션 UP! 웃음 유발", text: "5명 이상 모인 곳에서 갑자기 스쿼트 10개 하기" },
    { cat: "유형 3: 텐션 UP! 웃음 유발", text: "하늘을 가리키며 '와! 저 구름 모양 진짜 신기하다!'라고 말해 3명 이상 쳐다보게 만들기" },
    { cat: "유형 3: 텐션 UP! 웃음 유발", text: "이동 중 차 안에서 무반주로 노래 한 구절 부르고 박수 유도하기" },
    { cat: "유형 3: 텐션 UP! 웃음 유발", text: "사람들 앞에서 당당하게 '모델 워킹'으로 5미터 걷기" },
    { cat: "유형 3: 텐션 UP! 웃음 유발", text: "카페 대화 중 갑자기 일어서서 1분간 미니 스피치하기 (주제 자유)" },
    { cat: "유형 3: 텐션 UP! 웃음 유발", text: "주변 사람 중 한 명의 특징이나 말투 10초간 흉내 내기 (기분 좋게!)" },
    { cat: "유형 3: 텐션 UP! 웃음 유발", text: "카페 음악에 맞춰 아주 진지하고 우아하게 손가락 지휘 30초간 하기" },
    { cat: "유형 3: 텐션 UP! 웃음 유발", text: "서피비치 백사장에 '사랑해요♡ 청년센터' 크게 쓰고 인증샷 찍기" },
    { cat: "유형 4: 일상 소소 미션", text: "상대방과 가위바위보를 해서 연속 2번 이기기 (내기 금지!)" },
    { cat: "유형 4: 일상 소소 미션", text: "누군가 영상 촬영을 할 때 뒤에서 몰래 '꽃받침' 포즈로 출연하기" },
    { cat: "유형 4: 일상 소소 미션", text: "물병이나 소지품을 머리 위에 올리고 5초간 버티기 성공하기" },
    { cat: "유형 4: 일상 소소 미션", text: "상대방에게 '와, 오늘 진짜 에너지 넘치시네요!'라는 말 듣기" },
    { cat: "유형 4: 일상 소소 미션", text: "일명 '아재 개그' 하나 던져서 누군가를 피식 웃게 만들기" },
    { cat: "유형 4: 일상 소소 미션", text: "서피비치 주변의 쓰레기 3개 주워서 쓰레기통에 버리기" }
];

let currentMissions = [];
let revealed = [false, false];

// 페이지 로드 시 저장된 미션이 있는지 확인
window.onload = function() {
    const savedMission = localStorage.getItem('mySecretMission');
    if (savedMission) {
        showFinalMission(JSON.parse(savedMission));
        disableDrawButton('이미 미션을 받았습니다!');
    }
};

function drawMissions() {
    const drawBtn = document.getElementById('drawBtn');
    if (drawBtn.disabled) return;

    revealed = [false, false];
    // 무작위 2장 섞기
    const shuffled = [...missions].sort(() => Math.random() - 0.5);
    currentMissions = [shuffled[0], shuffled[1]];

    const cardArea = document.getElementById('cardArea');
    cardArea.innerHTML = `
        <div class="cards-row fade-in-up">
            <div class="card-wrap">
                <div class="card-scene" onclick="revealCard(0)">
                    <div class="card-inner" id="inner0">
                        <div class="card-face card-back"></div>
                        <div class="card-face card-front">
                            <span class="mission-cat">${currentMissions[0].cat}</span>
                            <p class="mission-text-card">${currentMissions[0].text}</p>
                        </div>
                    </div>
                </div>
                <button class="pick-btn" id="pick0" onclick="selectMission(0)">✅ 선택</button>
            </div>
            <div class="card-wrap">
                <div class="card-scene" onclick="revealCard(1)">
                    <div class="card-inner" id="inner1">
                        <div class="card-face card-back"></div>
                        <div class="card-face card-front">
                            <span class="mission-cat">${currentMissions[1].cat}</span>
                            <p class="mission-text-card">${currentMissions[1].text}</p>
                        </div>
                    </div>
                </div>
                <button class="pick-btn" id="pick1" onclick="selectMission(1)">✅ 선택</button>
            </div>
        </div>
    `;

    drawBtn.disabled = true;
    setGuide('카드를 터치하여 미션을 확인하세요!', true);
}

function revealCard(idx) {
    if (revealed[idx]) return;
    revealed[idx] = true;
    document.getElementById('inner' + idx).classList.add('flipped');

    if (revealed[0] && revealed[1]) {
        document.getElementById('pick0').style.display = 'inline-block';
        document.getElementById('pick1').style.display = 'inline-block';
        setGuide('하나의 미션을 최종 결정하세요!', true);
    }
}

function selectMission(idx) {
    const selected = currentMissions[idx];
    
    // 로컬 스토리지에 미션 저장 (새로고침해도 유지됨)
    localStorage.setItem('mySecretMission', JSON.stringify(selected));
    
    showFinalMission(selected);
    disableDrawButton('미션 뽑기 완료!');
}

function showFinalMission(mission) {
    const cardArea = document.getElementById('cardArea');
    cardArea.innerHTML = `
        <div class="cards-single fade-in-up">
            <div class="card-wrap">
                <div class="card-scene solo">
                    <div class="card-inner flipped">
                        <div class="card-face card-front selected">
                            <span class="mission-cat">${mission.cat}</span>
                            <p class="mission-text-card">${mission.text}</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    `;
    setGuide('당신의 비밀 미션입니다. 절대 비밀!', false);
}

function disableDrawButton(text) {
    const btn = document.getElementById('drawBtn');
    btn.disabled = true;
    btn.textContent = text;
}

function setGuide(text, active) {
    const g = document.getElementById('guide');
    g.textContent = text;
    g.className = 'guide' + (active ? ' active' : '');
}
</script>

</body>
</html>
