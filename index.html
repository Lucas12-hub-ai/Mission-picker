<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신학부 비밀미션 AI 봇</title>
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f0f8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 5px solid #ffcc00;
        }
        h1 {
            color: #0056b3;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 2rem;
        }
        #mission-card {
            background-color: #fffbe6;
            border: 2px dashed #ffcc00;
            border-radius: 15px;
            padding: 2rem;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
        }
        #mission-category {
            font-size: 0.8rem;
            font-weight: bold;
            color: #ff9900;
            margin-bottom: 10px;
        }
        #mission-text {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
            line-height: 1.5;
            word-break: keep-all;
        }
        button {
            background-color: #ffcc00;
            color: #333;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            width: 100%;
        }
        button:active {
            transform: scale(0.95);
        }
        button:hover {
            background-color: #ffb300;
        }
        .footer-text {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #999;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🕵️‍♂️ 비밀 미션 AI 봇</h1>
    <p class="subtitle">양양 단합대회: 질서 안의 자유!</p>
    
    <div id="mission-card">
        <div id="mission-category">미션 카테고리</div>
        <div id="mission-text">중앙 버튼을 눌러<br>비밀 미션을 확인하세요!</div>
    </div>

    <button onclick="drawMission()">미션 뽑기 🎲</button>
    
    <p class="footer-text">※ 미션은 비밀입니다. 들키면 바다 입수! (농담)</p>
</div>

<script>
    const missions = [
        { cat: "유형 1: 주강사&총무 공략", text: "담당 강사님(주강사님, 총무님)과 함께 손가락 하트 만들고 셀카 찍기" },
        { cat: "유형 1: 주강사&총무 공략", text: "총무님께 '오늘따라 참 귀여우시네요' 혹은 '귀엽다'는 말 듣기" },
        { cat: "유형 1: 주강사&총무 공략", text: "담당 강사님(주강사님)과 기분 좋게 '하이파이브' 2번 하기" },
        { cat: "유형 1: 주강사&총무 공략", text: "총무님과 똑같은 포즈로 나란히 서서 사진 찍기" },
        { cat: "유형 2: 사명자 친밀도 UP", text: "다른 차량 사명자에게 전화를 걸어 '사랑합니다, 연합합시다!' 외치고 끊기" },
        { cat: "유형 2: 사명자 친밀도 UP", text: "오늘 파란색(또는 특정색) 아이템을 착용한 사명자 찾아 패션 칭찬하기" },
        { cat: "유형 2: 사명자 친밀도 UP", text: "카페나 식당에서 다른 사명자의 빈 컵이나 쓰레기 3개 이상 대신 치워주기" },
        { cat: "유형 2: 사명자 친밀도 UP", text: "누군가의 고민을 듣게 된다면 '제가 오늘 꼭 기도할게요'라고 답해주기" },
        { cat: "유형 2: 사명자 친밀도 UP", text: "5명 이상 모인 곳에서 '우리는 하나!' 선창하고 후창 유도하기" },
        { cat: "유형 2: 사명자 친밀도 UP", text: "오늘 하루 동안 서로 다른 사명자 5명에게 '엄지 척' 날려주기" },
        { cat: "유형 2: 사명자 친밀도 UP", text: "상대방에게 'OO님은 진짜 센터의 기둥이세요'라고 말해주기" },
        { cat: "유형 3: 텐션 UP! 웃음 유발", text: "바다를 향해 '양양아! 내가 왔다!' 라고 크게 외치기 (최소 3명 동반)" },
        { cat: "유형 3: 텐션 UP! 웃음 유발", text: "사진 찍어주는 척하면서 내 얼굴 셀카 3장 몰래 찍어두기" },
        { cat: "유형 3: 텐션 UP! 웃음 유발", text: "5명 이상 모인 곳에서 갑자기 스쿼트 10개 하기" },
        { cat: "유형 3: 텐션 UP! 웃음 유발", text: "하늘을 가리키며 '와! 저 구름 모양 진짜 신기하다!'라고 말해 3명 이상 쳐다보게 만들기" },
        { cat: "유형 3: 텐션 UP! 웃음 유발", text: "이동 중 차 안에서 무반주로 노래 한 구절 부르고 박수 유도하기" },
        { cat: "유형 3: 텐션 UP! 웃음 유발", text: "사람들 앞에서 당당하게 '모델 워킹'으로 5미터 걷기" },
        { cat: "유형 3: 텐션 UP! 웃음 유발", text: "카페 대화 중 갑자기 일어서서 1분간 미니 스피치하기 (주제 자유)" },
        { cat: "유형 3: 텐션 UP! 웃음 유발", text: "주변 사람 중 한 명의 특징이나 말투 10초간 흉내 내기 (기분 좋게!)" },
        { cat: "유형 3: 텐션 UP! 웃음 유발", text: "서피비치 백사장에 '우리 조 이름' 크게 쓰고 인증샷 찍기" },
        { cat: "유형 4: 일상 소소 미션", text: "상대방과 가위바위보를 해서 연속 2번 이기기 (내기 금지!)" },
        { cat: "유형 4: 일상 소소 미션", text: "누군가 영상 촬영을 할 때 뒤에서 몰래 '꽃받침' 포즈로 출연하기" },
        { cat: "유형 4: 일상 소소 미션", text: "물병이나 소지품을 머리 위에 올리고 5초간 버티기 성공하기" },
        { cat: "유형 4: 일상 소소 미션", text: "상대방에게 '와, 오늘 진짜 에너지 넘치시네요!'라는 말 듣기" },
        { cat: "유형 4: 일상 소소 미션", text: "일명 '아재 개그' 하나 던져서 누군가를 피식 웃게 만들기" },
        { cat: "유형 4: 일상 소소 미션", text: "카페 음악에 맞춰 아주 진지하고 우아하게 손가락 지휘 30초간 하기" },
        { cat: "유형 4: 일상 소소 미션", text: "서피비치 주변의 쓰레기 3개 주워서 쓰레기통에 버리기" }
    ];

    function drawMission() {
        const card = document.getElementById('mission-card');
        const catElem = document.getElementById('mission-category');
        const textElem = document.getElementById('mission-text');

        // 애니메이션 효과
        card.style.transform = "scale(0.9)";
        
        setTimeout(() => {
            const randomIndex = Math.floor(Math.random() * missions.length);
            const mission = missions[randomIndex];

            catElem.innerText = mission.cat;
            textElem.innerText = mission.mission; // 오타 수정: mission.text가 맞음
            textElem.innerText = mission.text;
            
            card.style.transform = "scale(1)";
        }, 150);
    }
</script>

</body>
</html>
