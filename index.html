<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🕵️ 청년센터 단합 개인 비밀미션!</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f0f4f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            background: white;
            padding: 2.5rem 1.5rem;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 460px;
            width: 100%;
            border-top: 8px solid #0056b3;
        }

        h1 { color: #1a2a3a; font-size: 1.4rem; margin-bottom: 0.5rem; letter-spacing: -0.5px; }
        .subtitle { font-size: 0.9rem; color: #666; margin-bottom: 2rem; }

        /* 안내 문구 */
        .guide {
            font-size: 14px;
            color: #888;
            margin-bottom: 1.5rem;
            min-height: 20px;
            transition: all 0.3s;
        }
        .guide.active { color: #0056b3; font-weight: 700; transform: scale(1.05); }

        /* ── 타로 카드 스타일 ── */
        .card-area { min-height: 240px; margin-bottom: 1.5rem; }
        
        .cards-row { display: flex; gap: 12px; justify-content: center; }
        .cards-single { display: flex; justify-content: center; }

        .card-wrap { flex: 1; max-width: 180px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .card-scene { perspective: 1000px; width: 100%; height: 230px; cursor: pointer; }
        .card-scene.solo { width: 200px; cursor: default; }

        .card-inner {
            width: 100%; height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .card-inner.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute; inset: 0;
            backface-visibility: hidden;
            border-radius: 16px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 1rem;
        }

        /* 타로 뒷면 (이미지 없이 CSS로 구현) */
        .card-back {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d); /* 신비로운 그라데이션 */
            border: 4px solid #fff;
            box-shadow: inset 0 0 0 2px rgba(255,215,0,0.5), 0 5px 15px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }
        /* 타로 문양 */
        .card-back::after {
            content: '✨';
            font-size: 40px;
            color: rgba(255,255,255,0.8);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
        }

        /* 카드 앞면 */
        .card-front {
            background: #fff;
            border: 2px solid #0056b3;
            transform: rotateY(180deg);
            box-shadow: 0 5px 15px rgba(0,86,179,0.1);
        }
        .card-front.selected { border: 3px solid #ffd700; background: #fffdf0; }

        .mission-cat {
            font-size: 0.7rem; font-weight: 800; color: #0056b3;
            background: #eef6ff; padding: 4px 10px; border-radius: 20px; margin-bottom: 12px;
        }
        .mission-text-card {
            font-size: 0.95rem; font-weight: 600; color: #333; line-height: 1.6; word-break: keep-all;
        }

        /* 버튼 스타일 */
        .pick-btn {
            display: none; padding: 8px 16px; font-size: 13px; font-weight: 700;
            border-radius: 50px; border: none; cursor: pointer;
            background: #0056b3; color: white; transition: 0.2s;
        }

        .btn-main {
            width: 100%; padding: 1rem; font-size: 1rem; font-weight: 700;
            border-radius: 12px; border: none; cursor: pointer;
            background-color: #0056b3; color: white;
            transition: all 0.3s; margin-bottom: 1rem;
        }
        .btn-main:hover { background-color: #004494; }
        /* 비활성화 상태 (회색) */
        .btn-main:disabled {
            background-color: #ccc !important;
            color: #888 !important;
            cursor: not-allowed;
            transform: none !important;
        }

        .footer-text { font-size: 0.75rem; color: #bbb; margin-top: 10px; }
        .fade-in-up { animation: fadeInUp 0.5s ease both; }
        @keyframes fadeInUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <h1>🕵️‍♂️ 개인 비밀미션 뽑기</h1>
    <p class="subtitle">양양 단합대회 — 질서 안의 자유!</p>

    <p class="guide" id="guide">버튼을 눌러 미션 카드를 뽑으세요!</p>

    <div id="cardArea" class="card-area">
        <div class="cards-single">
            <div class="card-scene solo">
                <div class="card-inner">
                    <div class="card-face card-back"></div>
                </div>
            </div>
        </div>
    </div>

    <button class="btn-main" id="drawBtn" onclick="drawMissions()">🎲 미션 2장 뽑기</button>

    <p class="footer-text">※ 미션은 비밀입니다. 들키면 바다 입수! 🌊</p>
</div>

<script>
// 미션 데이터 (기존 데이터 유지)
const missions = [
    { cat: "유형 1: 주강사&총무 공략", text: "담당 강사님(주강사님, 총무님)과 함께 손가락 하트 만들고 셀카 찍기" },
    { cat: "유형 1: 주강사&총무 공략", text: "총무님께 '오늘따라 참 귀여우시네요' 혹은 '귀엽다'는 말 듣기" },
    { cat: "유형 1: 주강사&총무 공략", text: "담당 강사님(주강사님)과 기분 좋게 '하이파이브' 2번 하기" },
    { cat: "유형 1: 주강사&총무 공략", text: "총무님과 똑같은 포즈로 나란히 서서 사진 찍기" },
    { cat: "유형 2: 사명자 친밀도 UP", text: "다른 차량 사명자에게 전화를 걸어 '사랑합니다, 연합합시다!' 외치고 끊기" },
    { cat: "유형 2: 사명자 친밀도 UP", text: "오늘 특정색 아이템을 착용한 사명자 찾아 패션 칭찬하기" },
    { cat: "유형 2: 사명자 친밀도 UP", text: "상대방에게 'OO님은 진짜 센터의 기둥이세요'라고 말해주기" },
    { cat: "유형 3: 텐션 UP! 웃음 유발", text: "바다를 향해 '양양아! 내가 왔다!' 라고 크게 외치기" },
    { cat: "유형 3: 텐션 UP! 웃음 유발", text: "5명 이상 모인 곳에서 갑자기 스쿼트 10개 하기" },
    { cat: "유형 3: 텐션 UP! 웃음 유발", text: "사람들 앞에서 당당하게 '모델 워킹'으로 5미터 걷기" },
    { cat: "유형 4: 일상 소소 미션", text: "상대방과 가위바위보를 해서 연속 2번 이기기" },
    { cat: "유형 4: 일상 소소 미션", text: "서피비치 주변의 쓰레기 3개 주워서 쓰레기통에 버리기" }
    // ... 더 많은 미션을 추가하셔도 됩니다.
];

let currentMissions = [];
let revealed = [false, false];

// 페이지 로드 시 저장된 미션이 있는지 확인
window.onload = function() {
    const savedMission = localStorage.getItem('mySecretMission');
    if (savedMission) {
        showFinalMission(JSON.parse(savedMission));
        disableDrawButton('이미 미션을 받았습니다!');
    }
};

function drawMissions() {
    const drawBtn = document.getElementById('drawBtn');
    if (drawBtn.disabled) return;

    revealed = [false, false];
    // 무작위 2장 섞기
    const shuffled = [...missions].sort(() => Math.random() - 0.5);
    currentMissions = [shuffled[0], shuffled[1]];

    const cardArea = document.getElementById('cardArea');
    cardArea.innerHTML = `
        <div class="cards-row fade-in-up">
            <div class="card-wrap">
                <div class="card-scene" onclick="revealCard(0)">
                    <div class="card-inner" id="inner0">
                        <div class="card-face card-back"></div>
                        <div class="card-face card-front">
                            <span class="mission-cat">${currentMissions[0].cat}</span>
                            <p class="mission-text-card">${currentMissions[0].text}</p>
                        </div>
                    </div>
                </div>
                <button class="pick-btn" id="pick0" onclick="selectMission(0)">✅ 선택</button>
            </div>
            <div class="card-wrap">
                <div class="card-scene" onclick="revealCard(1)">
                    <div class="card-inner" id="inner1">
                        <div class="card-face card-back"></div>
                        <div class="card-face card-front">
                            <span class="mission-cat">${currentMissions[1].cat}</span>
                            <p class="mission-text-card">${currentMissions[1].text}</p>
                        </div>
                    </div>
                </div>
                <button class="pick-btn" id="pick1" onclick="selectMission(1)">✅ 선택</button>
            </div>
        </div>
    `;

    drawBtn.disabled = true;
    setGuide('카드를 터치하여 미션을 확인하세요!', true);
}

function revealCard(idx) {
    if (revealed[idx]) return;
    revealed[idx] = true;
    document.getElementById('inner' + idx).classList.add('flipped');

    if (revealed[0] && revealed[1]) {
        document.getElementById('pick0').style.display = 'inline-block';
        document.getElementById('pick1').style.display = 'inline-block';
        setGuide('하나의 미션을 최종 결정하세요!', true);
    }
}

function selectMission(idx) {
    const selected = currentMissions[idx];
    
    // 로컬 스토리지에 미션 저장 (새로고침해도 유지됨)
    localStorage.setItem('mySecretMission', JSON.stringify(selected));
    
    showFinalMission(selected);
    disableDrawButton('미션 뽑기 완료!');
}

function showFinalMission(mission) {
    const cardArea = document.getElementById('cardArea');
    cardArea.innerHTML = `
        <div class="cards-single fade-in-up">
            <div class="card-wrap">
                <div class="card-scene solo">
                    <div class="card-inner flipped">
                        <div class="card-face card-front selected">
                            <span class="mission-cat">${mission.cat}</span>
                            <p class="mission-text-card">${mission.text}</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    `;
    setGuide('당신의 비밀 미션입니다. 절대 비밀!', false);
}

function disableDrawButton(text) {
    const btn = document.getElementById('drawBtn');
    btn.disabled = true;
    btn.textContent = text;
}

function setGuide(text, active) {
    const g = document.getElementById('guide');
    g.textContent = text;
    g.className = 'guide' + (active ? ' active' : '');
}
</script>

</body>
</html>
