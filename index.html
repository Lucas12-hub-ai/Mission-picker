<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎯 오늘의 미션 뽑기</title>
<link href="https://fonts.googleapis.com/css2?family=Gmarket+Sans:wght@300;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0c1a;
    --bg2: #1a1530;
    --card-bg: #201c35;
    --accent: #c084fc;
    --accent2: #f0abfc;
    --gold: #fbbf24;
    --text: #f3f0ff;
    --text2: #a89cc8;
    --border: rgba(192,132,252,0.2);
    --glow: 0 0 40px rgba(192,132,252,0.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* 배경 별빛 효과 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(192,132,252,0.12) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(240,171,252,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(251,191,36,0.04) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle var(--d) ease-in-out infinite alternate;
    opacity: 0;
  }

  @keyframes twinkle {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: var(--op); transform: scale(1.2); }
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 680px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 4rem;
  }

  /* 헤더 */
  .header {
    text-align: center;
    margin-bottom: 3rem;
    animation: fadeDown 0.7s ease both;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .header-tag {
    display: inline-block;
    font-family: 'Gmarket Sans', sans-serif;
    font-size: 12px;
    font-weight: 300;
    letter-spacing: 0.2em;
    color: var(--accent);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 5px 16px;
    margin-bottom: 1.2rem;
    text-transform: uppercase;
  }

  .header h1 {
    font-family: 'Gmarket Sans', sans-serif;
    font-size: clamp(2rem, 6vw, 3rem);
    font-weight: 700;
    line-height: 1.2;
    background: linear-gradient(135deg, #f3f0ff 0%, var(--accent) 50%, var(--gold) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.75rem;
  }

  .header p {
    color: var(--text2);
    font-size: 15px;
    line-height: 1.6;
  }

  /* 카운터 */
  .counter-row {
    display: flex;
    justify-content: center;
    gap: 1rem;
    margin-bottom: 2.5rem;
    animation: fadeUp 0.7s 0.1s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .counter-pill {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 8px 20px;
    font-size: 13px;
    color: var(--text2);
  }

  .counter-pill span {
    color: var(--accent);
    font-weight: 700;
    font-size: 15px;
  }

  /* 카드 영역 */
  .card-scene {
    perspective: 1200px;
    width: 100%;
    max-width: 420px;
    height: 260px;
    margin: 0 auto 2rem;
    cursor: pointer;
    animation: fadeUp 0.7s 0.2s ease both;
  }

  .card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.65s cubic-bezier(.4,0,.2,1);
  }

  .card-inner.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    border: 1px solid var(--border);
  }

  .card-back {
    background: var(--card-bg);
    box-shadow: var(--glow), inset 0 1px 0 rgba(255,255,255,0.07);
  }

  .card-back-pattern {
    position: absolute;
    inset: 0;
    border-radius: 20px;
    overflow: hidden;
    opacity: 0.15;
    background-image:
      repeating-linear-gradient(45deg, var(--accent) 0, var(--accent) 1px, transparent 0, transparent 50%);
    background-size: 20px 20px;
  }

  .card-back-content { position: relative; text-align: center; }
  .card-back-emoji { font-size: 52px; margin-bottom: 0.75rem; display: block; animation: float 3s ease-in-out infinite; }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .card-back-hint { font-size: 14px; color: var(--text2); letter-spacing: 0.05em; }

  .card-front {
    background: linear-gradient(135deg, #2d2050 0%, #1e1a3a 50%, #2a1f45 100%);
    transform: rotateY(180deg);
    box-shadow: var(--glow);
    text-align: center;
    gap: 0.75rem;
  }

  .mission-emoji { font-size: 44px; }

  .mission-text {
    font-size: 17px;
    font-weight: 500;
    line-height: 1.6;
    color: var(--text);
    max-width: 320px;
  }

  .mission-category {
    font-size: 12px;
    color: var(--accent);
    background: rgba(192,132,252,0.12);
    border: 1px solid rgba(192,132,252,0.3);
    border-radius: 100px;
    padding: 4px 14px;
    letter-spacing: 0.05em;
  }

  /* 버튼 */
  .btn-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 2rem;
    animation: fadeUp 0.7s 0.3s ease both;
  }

  .btn {
    font-family: 'Gmarket Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 12px 28px;
    border-radius: 100px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.2s ease;
    letter-spacing: 0.03em;
  }

  .btn:active { transform: scale(0.96); }

  .btn-primary {
    background: linear-gradient(135deg, #a855f7, #c084fc);
    color: white;
    border-color: transparent;
    box-shadow: 0 4px 24px rgba(168,85,247,0.4);
  }

  .btn-primary:hover {
    box-shadow: 0 6px 32px rgba(168,85,247,0.6);
    transform: translateY(-1px);
  }

  .btn-secondary {
    background: transparent;
    color: var(--text2);
  }

  .btn-secondary:hover {
    background: var(--card-bg);
    color: var(--text);
    border-color: rgba(192,132,252,0.4);
  }

  /* 완료 배너 */
  .complete-banner {
    display: none;
    text-align: center;
    padding: 1.25rem;
    background: linear-gradient(135deg, rgba(251,191,36,0.1), rgba(240,171,252,0.1));
    border: 1px solid rgba(251,191,36,0.3);
    border-radius: 16px;
    margin-bottom: 2rem;
    color: var(--gold);
    font-size: 15px;
    font-weight: 500;
    animation: fadeUp 0.5s ease both;
  }

  /* 히스토리 */
  .history-section {
    display: none;
    animation: fadeUp 0.5s ease both;
  }

  .history-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
  }

  .history-title {
    font-family: 'Gmarket Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--text2);
    letter-spacing: 0.05em;
  }

  .history-clear {
    font-size: 12px;
    color: var(--text2);
    background: none;
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 4px 12px;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    transition: all 0.2s;
  }

  .history-clear:hover { color: var(--text); border-color: rgba(192,132,252,0.5); }

  .history-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 320px;
    overflow-y: auto;
    padding-right: 4px;
  }

  .history-grid::-webkit-scrollbar { width: 4px; }
  .history-grid::-webkit-scrollbar-track { background: transparent; }
  .history-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

  .history-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    animation: slideIn 0.3s ease both;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .history-emoji { font-size: 22px; flex-shrink: 0; }
  .history-text { font-size: 14px; color: var(--text); flex: 1; line-height: 1.4; }
  .history-cat {
    font-size: 11px;
    color: var(--accent);
    background: rgba(192,132,252,0.1);
    border-radius: 100px;
    padding: 3px 10px;
    flex-shrink: 0;
  }

  /* 반짝이 파티클 효과 */
  .confetti-wrap {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    animation: fallDown 1s ease-out both;
  }

  @keyframes fallDown {
    from { opacity: 1; transform: translateY(-20px) rotate(0deg); }
    to { opacity: 0; transform: translateY(120px) rotate(360deg); }
  }

  @media (max-width: 480px) {
    .container { padding: 2rem 1rem 3rem; }
    .card-scene { height: 220px; }
    .mission-text { font-size: 15px; }
    .btn { padding: 11px 22px; font-size: 13px; }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="confetti-wrap" id="confetti"></div>

<div class="container">

  <header class="header">
    <div class="header-tag">✨ Mission Roulette</div>
    <h1>오늘의 미션 뽑기</h1>
    <p>청년센터 단합 나들이 — 서로 알아가는 즐거운 미션!</p>
  </header>

  <div class="counter-row">
    <div class="counter-pill">남은 미션 <span id="remainNum">18</span>개</div>
    <div class="counter-pill">완료 <span id="doneNum">0</span>개</div>
  </div>

  <div class="card-scene" id="cardScene" onclick="flipCard()">
    <div class="card-inner" id="cardInner">
      <div class="card-face card-back">
        <div class="card-back-pattern"></div>
        <div class="card-back-content">
          <span class="card-back-emoji">🎴</span>
          <p class="card-back-hint">눌러서 미션 공개!</p>
        </div>
      </div>
      <div class="card-face card-front">
        <div class="mission-emoji" id="missionEmoji">🎯</div>
        <p class="mission-text" id="missionText">미션 내용이 여기에 표시됩니다</p>
        <span class="mission-category" id="missionCat">카테고리</span>
      </div>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" onclick="drawMission()">🎲 미션 뽑기</button>
    <button class="btn btn-secondary" onclick="resetAll()">↺ 초기화</button>
  </div>

  <div class="complete-banner" id="completeBanner">
    🎊 모든 미션 완료! 다들 정말 잘했어요. 초기화하고 다시 도전해보세요!
  </div>

  <div class="history-section" id="historySection">
    <div class="history-header">
      <p class="history-title">📋 뽑힌 미션 기록</p>
    </div>
    <div class="history-grid" id="historyGrid"></div>
  </div>

</div>

<script>
const missions = [
  { emoji: "🤝", text: "처음 만난 사람에게 먼저 이름 물어보고 악수하기", category: "친해지기" },
  { emoji: "📸", text: "5명과 함께 단체 셀카 찍기", category: "친해지기" },
  { emoji: "😂", text: "1분 안에 3명을 웃기기", category: "도전" },
  { emoji: "🎤", text: "아무 노래나 후렴구 한 소절 불러주기", category: "도전" },
  { emoji: "🕺", text: "리더가 시키는 춤 10초 따라하기", category: "도전" },
  { emoji: "🙈", text: "눈 감고 3명의 목소리만 듣고 이름 맞추기", category: "게임" },
  { emoji: "💬", text: "자신의 인생 최고의 순간 30초 안에 말하기", category: "친해지기" },
  { emoji: "🤸", text: "그룹 전체와 가위바위보 해서 1등 되기", category: "게임" },
  { emoji: "🎁", text: "옆 사람에게 진심 칭찬 한마디 전하기", category: "따뜻한 미션" },
  { emoji: "🧩", text: "처음 만난 사람과 공통점 3가지 찾기", category: "친해지기" },
  { emoji: "🏃", text: "그룹에서 가장 빠른 사람 찾기 — 달리기 대결!", category: "게임" },
  { emoji: "🌟", text: "오늘 처음 만난 사람의 장점 2가지 말하기", category: "따뜻한 미션" },
  { emoji: "🎲", text: "숫자 369 게임 5라운드 진행하기", category: "게임" },
  { emoji: "🗺️", text: "지금 있는 장소에서 가장 멋진 뷰 찾아서 공유하기", category: "도전" },
  { emoji: "🍽️", text: "같이 밥 먹을 새 친구 2명 섭외하기", category: "친해지기" },
  { emoji: "📖", text: "성경 구절 한 구절 외워서 그룹에 선포하기", category: "신앙" },
  { emoji: "🙏", text: "옆 사람을 위해 30초 즉흥 기도해주기", category: "신앙" },
  { emoji: "✍️", text: "오늘 감사한 것 3가지 그 자리에서 말하기", category: "신앙" },
];

let remaining = [...missions];
let drawn = [];
let isFlipped = false;
let current = null;

// 별 생성
const starsEl = document.getElementById('stars');
for (let i = 0; i < 80; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const size = Math.random() * 2.5 + 0.5;
  s.style.cssText = `width:${size}px;height:${size}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${2+Math.random()*4}s;--op:${0.3+Math.random()*0.7};animation-delay:${Math.random()*5}s`;
  starsEl.appendChild(s);
}

function updateCount() {
  document.getElementById('remainNum').textContent = remaining.length;
  document.getElementById('doneNum').textContent = drawn.length;
  document.getElementById('completeBanner').style.display = remaining.length === 0 ? 'block' : 'none';
}

function flipCard() {
  const inner = document.getElementById('cardInner');
  if (!isFlipped && current) {
    inner.classList.add('flipped');
    isFlipped = true;
  }
}

function drawMission() {
  if (remaining.length === 0) return;
  const inner = document.getElementById('cardInner');
  inner.classList.remove('flipped');
  isFlipped = false;

  setTimeout(() => {
    const idx = Math.floor(Math.random() * remaining.length);
    current = remaining.splice(idx, 1)[0];
    drawn.unshift(current);
    document.getElementById('missionEmoji').textContent = current.emoji;
    document.getElementById('missionText').textContent = current.text;
    document.getElementById('missionCat').textContent = current.category;
    updateCount();
    updateHistory();

    setTimeout(() => {
      inner.classList.add('flipped');
      isFlipped = true;
      spawnParticles();
    }, 150);
  }, 80);
}

function updateHistory() {
  const sec = document.getElementById('historySection');
  const grid = document.getElementById('historyGrid');
  if (drawn.length === 0) { sec.style.display = 'none'; return; }
  sec.style.display = 'block';
  grid.innerHTML = drawn.map(m => `
    <div class="history-item">
      <span class="history-emoji">${m.emoji}</span>
      <span class="history-text">${m.text}</span>
      <span class="history-cat">${m.category}</span>
    </div>
  `).join('');
}

function resetAll() {
  remaining = [...missions];
  drawn = [];
  current = null;
  const inner = document.getElementById('cardInner');
  inner.classList.remove('flipped');
  isFlipped = false;
  updateCount();
  updateHistory();
}

function spawnParticles() {
  const wrap = document.getElementById('confetti');
  const colors = ['#c084fc','#f0abfc','#fbbf24','#a78bfa','#fb7185'];
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.cssText = `
      left: ${20 + Math.random()*60}%;
      top: ${20 + Math.random()*30}%;
      background: ${colors[Math.floor(Math.random()*colors.length)]};
      animation-delay: ${Math.random()*0.3}s;
      animation-duration: ${0.8+Math.random()*0.6}s;
      width: ${5+Math.random()*6}px;
      height: ${5+Math.random()*6}px;
    `;
    wrap.appendChild(p);
    setTimeout(() => p.remove(), 1500);
  }
}

updateCount();
</script>
</body>
</html>
