<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 미션 뽑기</title>
    <style>
        :root {
            --bg-color: #0f0c29;
            --card-bg: #1b1b3a;
            --accent-color: #a29bfe;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, sans-serif;
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #a29bfe, #ff7675);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 40px;
        }

        /* 카드 영역 */
        .card-container {
            position: relative;
            width: 100%;
            aspect-ratio: 3/4;
            perspective: 1000px;
            margin-bottom: 30px;
        }

        .card {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        /* 카드 앞면 (물음표 이미지) */
        .card-front {
            background: var(--card-bg);
            background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.05) 10px, rgba(255,255,255,0.05) 20px);
        }

        .card-front .icon {
            font-size: 80px;
            margin-bottom: 15px;
        }

        /* 카드 뒷면 (결과 이미지) */
        .card-back {
            background: #ffffff;
            color: #333;
            transform: rotateY(180deg);
            padding: 20px;
            box-sizing: border-box;
        }

        .mission-text {
            font-size: 1.5rem;
            font-weight: bold;
            word-break: keep-all;
            line-height: 1.4;
        }

        /* 버튼 */
        .btn-draw {
            background: linear-gradient(45deg, #6c5ce7, #a29bfe);
            border: none;
            padding: 15px 40px;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.4);
            transition: 0.3s;
        }

        .btn-draw:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(108, 92, 231, 0.6);
        }

        .btn-draw:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>오늘의 미션 뽑기</h1>
    <p class="subtitle">청년센터 단합 나들이 — 당신의 미션은?</p>

    <div class="card-container">
        <div id="card" class="card">
            <div class="card-face card-front">
                <div class="icon">🎁</div>
                <p>카드를 눌러 미션 공개!</p>
            </div>
            <div class="card-face card-back">
                <p style="font-size: 0.9rem; color: #888; margin-bottom: 10px;">당신에게 주어진 미션</p>
                <div id="missionResult" class="mission-text">미션을 확인하세요!</div>
            </div>
        </div>
    </div>

    <button id="drawBtn" class="btn-draw">미션 뽑기 🎲</button>
</div>

<script>
    // 30명의 미션 리스트 (내용을 자유롭게 수정하세요!)
    const missions = [
        "처음 본 사람과 하이파이브 하기",
        "오늘 가장 멀리서 온 사람 찾기",
        "센터장님과 셀카 찍기",
        "옆 사람에게 칭찬 한 마디 하기",
        "간식 맛있게 나눠주기",
        "가장 최근에 입사(가입)한 사람 찾기",
        "자신의 MBTI를 몸으로 표현하기",
        "나들이 장소에서 가장 예쁜 꽃 사진 찍기",
        "팀원 전체의 이름을 외워서 말하기",
        "오늘 점심 메뉴 맞히기",
        "간식 박스 정리 돕기",
        "나들이 소감을 5자로 말하기",
        "가장 밝게 웃는 사람 사진 찍어주기",
        "노래 한 소절 부르기",
        "주변 쓰레기 하나 줍기",
        "3명 이상과 단체 사진 찍기",
        "오늘의 날씨를 표현하는 포즈 취하기",
        "자신의 별명 소개하기",
        "가장 나이가 많은 분께 건강 인사하기",
        "센터에 바라는 점 한 가지 말하기",
        "행운의 편지(긍정 메모) 써서 전달하기",
        "가장 최근에 생일이었던 사람 축하해주기",
        "함께 온 동료와 가위바위보 이기기",
        "가장 화려한 옷을 입은 사람 칭찬하기",
        "오늘 가장 기분 좋은 일 공유하기",
        "센터 SNS 팔로우 인증하기",
        "미션 완료 후 인증샷 남기기",
        "단체 톡방에 이모티콘 3개 날리기",
        "제일 먼저 도착한 사람 찾기",
        "마지막까지 웃음을 잃지 않기"
    ];

    const card = document.getElementById('card');
    const drawBtn = document.getElementById('drawBtn');
    const missionResult = document.getElementById('missionResult');

    // 페이지 로드 시 기존 미션이 있는지 확인
    window.onload = () => {
        const savedMission = localStorage.getItem('myPickedMission');
        if (savedMission) {
            showMission(savedMission);
        }
    };

    // 미션 뽑기 버튼 클릭
    drawBtn.addEventListener('click', drawMission);
    card.addEventListener('click', () => {
        if (!localStorage.getItem('myPickedMission')) {
            drawMission();
        }
    });

    function drawMission() {
        if (localStorage.getItem('myPickedMission')) return;

        const randomIndex = Math.floor(Math.random() * missions.length);
        const selectedMission = missions[randomIndex];

        // 로컬 스토리지에 저장 (이후 다시 접속해도 동일한 미션)
        localStorage.setItem('myPickedMission', selectedMission);
        
        showMission(selectedMission);
    }

    function showMission(mission) {
        missionResult.innerText = mission;
        card.classList.add('is-flipped');
        drawBtn.disabled = true;
        drawBtn.innerText = "이미 미션을 뽑았습니다";
    }
</script>

</body>
</html>
